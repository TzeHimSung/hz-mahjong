[build-system]
requires = [
    "setuptools>=68",
    "ziglang==0.13.0.post1; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
build-backend = "setuptools.build_meta"

[project]
name = "hz-mahjong-heuristic-ai"
version = "0.16.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "httpx[http2,socks]==0.28.1", "httpcore==1.0.9", "anyio>=4,<5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
